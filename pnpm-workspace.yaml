packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 requires an explicit true/false decision for every dependency with
# a build script. Placeholder values are NOT decisions — pnpm 11 exits 1 with
# ERR_PNPM_IGNORED_BUILDS for anything undecided, which fails CI at the very
# first step. These are the decisions:
#   esbuild: true  — tsx/vitest need the platform binary wired up.
#   sharp: false   — transitive Next.js image-optimizer dep; sharp >=0.33
#                    ships prebuilt binaries via @img/* optional packages and
#                    its install script is only a check, so it is deliberately
#                    kept unbuilt.
allowBuilds:
  esbuild: true
  sharp: false

# Kept in sync with allowBuilds (the pre-pnpm-11 spelling of the same
# allowlist) so tooling on pnpm 10 agrees with 11.
onlyBuiltDependencies:
  - esbuild

# pnpm re-checks install state before every script run. esbuild's build-script
# notice makes that check exit non-zero even when the binary is present and
# working, which would break every `pnpm test` / `pnpm typecheck` in CI.
verifyDepsBeforeRun: false
